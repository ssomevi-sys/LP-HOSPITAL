svcReq(d){const L=D.svc.filter(s=>s.on);if(!L.length){alert('No services are available. Ask the administrator to add one.');return}modal('Request a service',`<div class="fg">${pSel('pid',d.pid)}<div class="w"><label>Service</label><select id="f_sv">${svcOpts(L)}</select></div>${fld('nt','Note / instructions','area',0,'',1)}</div>`,()=>{const s=D.svc.find(x=>x.id==fv('sv'));D.sreq.push({id:nid('SR',D.sreq),pid:fv('pid'),svc:s.id,name:s.name,dept:s.dept,price:s.price,by:ME.u,d:today(),note:fv('nt'),st:'Requested'});bill(fv('pid'),'Service: '+s.name,s.price);save();render()},'Request')},
svcSt(d){const r=D.sreq.find(x=>x.id==d.id);if(d.s=='Cancelled'){if(!confirm('Cancel this request? The charge will be credited on the invoice.'))return;bill(r.pid,'Credit (cancelled): '+r.name,-r.price)}r.st=d.s;r.upd=now()+' by '+ME.n;save();render()},
svcNew(){modal('Add service',`<div class="fg">${fld('n','Service name','text',0,'',1)}${fld('dp','Department','sel',deptNames(),'')}${fld('pr','Price','number',0,'')}</div>`,()=>{if(!fv('n')){alert('Enter the service name.');return false}D.svc.push({id:'S'+(D.svc.length+1),name:fv('n'),dept:fv('dp'),price:+fv('pr')||0,on:1});save();render()})},
svcEdit(d){const s=D.svc.find(x=>x.id==d.id);modal('Edit service',`<div class="fg">${fld('n','Service name','text',0,s.name,1)}${fld('dp','Department','sel',deptNames(),s.dept)}${fld('pr','Price','number',0,s.price)}${fld('on','Availability','sel',[['1','Available'],['0','Unavailable']],s.on?'1':'0')}</div>`,()=>{if(!fv('n')){alert('Enter the service name.');return false}Object.assign(s,{name:fv('n'),dept:fv('dp'),price:+fv('pr')||0,on:+fv('on')});save();render()})},
bed(d){const b=D.beds.find(x=>x.id==d.id);if(!b.pid){if(!can('reception','doctor')){alert('Only reception or doctors can admit patients.');return}const free=D.pat.filter(p=>!D.beds.some(x=>x.pid==p.id));
modal('Admit to '+b.ward+' bed '+b.id,`<div class="fg">${fld('pid','Patient','sel',free.map(p=>[p.id,p.id+' · '+p.name]),'',1)}${fld('rs','Reason for admission','text',0,'',1)}</div>`,()=>{b.pid=fv('pid');D.adm.push({id:nid('AD',D.adm),pid:b.pid,bed:b.id,reason:fv('rs'),d:today(),out:''});save();render()},'Admit')}
else{const a=D.adm.find(x=>x.bed==b.id&&!x.out);modal('Bed '+b.id,`<p><b>${esc(P(b.pid).name)}</b> admitted ${a?a.d:''}<br>Reason: ${esc(a?a.reason:'')}</p>`,can('reception','doctor')?()=>{const days=Math.max(1,Math.round((Date.now()-new Date(a.d))/864e5));bill(b.pid,'Bed charge: '+b.ward+' × '+days+' day(s)',days*D.cfg.bed);a.out=today();b.pid=null;save();render()}:null,'Discharge patient')}},
disp(d){const r=D.rx.find(x=>x.id==d.id);for(const i of r.items){const g=D.drugs.find(x=>x.id==i.drug);if(g.stock<i.qty){alert('Not enough stock of '+g.name+' (only '+g.stock+').');return}}r.items.forEach(i=>{const g=D.drugs.find(x=>x.id==i.drug);g.stock-=i.qty;bill(r.pid,'Drug: '+g.name+' ×'+i.qty,g.price*i.qty)});r.st='Dispensed';save();render()},
drugNew(){modal('Add drug',`<div class="fg">${fld('n','Name','text',0,'',1)}${fld('pr','Price','number',0,'')}${fld('st','Opening stock','number',0,'')}${fld('mn','Reorder level','number',0,'50')}</div>`,()=>{if(!fv('n')){alert('Enter a name.');return false}D.drugs.push({id:'D'+(D.drugs.length+1),name:fv('n'),price:+fv('pr')||0,stock:+fv('st')||0,min:+fv('mn')||0});save();render()})},
restock(d){const g=D.drugs.find(x=>x.id==d.id);modal('Restock '+esc(g.name),`<div class="fg">${fld('q','Quantity received','number',0,'')}</div>`,()=>{if(!(+fv('q')>0)){alert('Enter a quantity.');return false}g.stock+=+fv('q');save();render()})},
invOpen(d){const i=D.inv.find(x=>x.id==d.id),due=tot(i)-i.paid;modal('Invoice '+i.id+' · '+esc(P(i.pid).name),`${tbl(['Date','Item','Amount'],i.items.map(x=>[x.d,esc(x.desc),money(x.amt)]))}<p><b>Total ${money(tot(i))}</b> · Paid ${money(i.paid)} · <b>Balance ${money(due)}</b></p>${due>0&&can('cashier')?`<div class="fg np">${fld('am','Amount received','number',0,due.toFixed(2))}${fld('mt','Method','sel',['Cash','Mobile money','Card','Insurance'],'')}</div>`:''}<p class="np"><button class="btn s x" onclick="window.print()">🖨 Print</button></p>`,due>0&&can('cashier')?()=>{const a=+fv('am');if(!(a>0)){alert('Enter an amount.');return false}i.paid=Math.min(tot(i),i.paid+a);i.st=i.paid>=tot(i)-.001?'Paid':'Part';save();render()}:null,'Record payment')},
usrNew(){modal('Add staff account',`<div class="fg">${fld('n','Full name','text',0,'',1)}${fld('u','Username','text',0,'')}${fld('r','Role','sel',['doctor','reception','pharmacy','cashier','admin'],'')}${fld('dp','Department','sel',[['','— none —'],...deptNames().map(x=>[x,x])],'',1)}${fld('p','Temporary password (min 6)','text',0,'',1)}</div>`,()=>{const u=fv('u').toLowerCase();if(!fv('n')||!/^[a-z0-9._-]{3,}$/.test(u)||fv('p').length<6){alert('Enter a name, a username (3+ letters/numbers) and a password of at least 6 characters.');return false}if(D.users.some(x=>x.u==u)){alert('That username is taken.');return false}D.users.push((()=>{const salt=rsalt();return{u,n:fv('n'),r:fv('r'),salt,p:hpw(u,fv('p'),salt),on:1,dp:fv('dp')}})());save();render()})},
usrTog(d){const u=D.users[+d.i];u.on=u.on?0:1;save();render()},
usrPw(d){const u=D.users[+d.i],p=prompt('New password for '+u.u+' (min 6 characters):');if(p&&p.length>=6){u.salt=rsalt();u.p=hpw(u.u,p,u.salt);save();alert('Password updated.')}else if(p)alert('Too short.')},
setSave(){D.cfg.name=fv('hn')||D.cfg.name;D.cfg.cur=fv('cu')||D.cfg.cur;D.cfg.fee=+fv('fe')||0;D.cfg.bed=+fv('bd')||0;save();render()},
exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='hospital-backup-'+today()+'.json';a.click()},
reset(){if(confirm('Erase ALL records and restore the demo data?')){D=seed();save();ME=null;render()}}};
async function imp(f){if(!f)return;try{const d=JSON.parse(await f.text());if(!d.pat||!d.users)throw 0;D=d;save();ME=null;render();alert('Backup restored. Please sign in again.')}catch(e){alert('That file is not a valid backup.')}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(a&&ACT[a.dataset.a])ACT[a.dataset.a](a.dataset)});
document.addEventListener('keydown',e=>{if(e.key=='Escape')closeM()});
try{const u=sessionStorage.getItem('hms_me');if(u)ME=D.users.find(x=>x.u==u&&x.on)||null}catch(e){}
/* ---------- shared database (Firestore) ---------- */
const am=e=>e.code=='permission-denied'?'Firestore rules block this. Publish the rules shown in Settings (Firestore › Rules).':e.code=='not-found'?'Firestore database not found. Create it in the Firebase console (Firestore Database › Create database).':e.code=='unavailable'?'Cannot reach Firestore. Check your internet connection.':(e.message||String(e));
function sy(t){if(t!==undefined)SY=t;const e=document.getElementById('sy');if(e)e.textContent=SY}
function busyMsg(m){$('#app').innerHTML=`<div id="lg"><div class="box glass"><div class="cross">✚</div><h1>${esc(D.cfg.name)}</h1><small>${esc(m)}</small></div></div>`}
function toDocs(){const d={};for(const[k,c]of Object.entries(COLS))D[k].forEach(x=>{d[c+'/'+x.id]=x});D.users.forEach(u=>{d['hms_users/'+u.u]=u});d['hms_meta/config']={cfg:D.cfg,v:D.v||3};return d}
async function pull(){const names=[...Object.values(COLS),'hms_users'],sn=await Promise.all(names.map(c=>db.collection(c).get())),mc=await db.doc('hms_meta/config').get(),N=empty();
Object.keys(COLS).forEach((k,i)=>{N[k]=sn[i].docs.map(d=>d.data()).sort(byId)});N.users=sn[sn.length-1].docs.map(d=>d.data());if(mc.exists){N.cfg=mc.data().cfg||N.cfg;N.v=mc.data().v||3}
D=N;last={};for(const[p,v]of Object.entries(toDocs()))last[p]=cj(v)}
async function push(){if(!db||!ME)return false;if(busyPush){tm=setTimeout(push,400);return false}busyPush=true;let ok=true;
try{const cur=toDocs(),ops=[];for(const[p,v]of Object.entries(cur)){const j=cj(v);if(last[p]!==j)ops.push([p,v,j])}for(const p of Object.keys(last))if(!(p in cur))ops.push([p,null,null]);
for(let i=0;i<ops.length;i+=400){const b=db.batch(),ch=ops.slice(i,i+400);ch.forEach(([p,v])=>v===null?b.delete(db.doc(p)):b.set(db.doc(p),JSON.parse(JSON.stringify(v))));await b.commit();ch.forEach(([p,v,j])=>{if(v===null)delete last[p];else last[p]=j})}
dirty=false;sy('Saved ✓ · shared')}catch(e){ok=false;sy('Not saved ⚠');alert('Could not save to the shared database: '+am(e))}busyPush=false;return ok}
function softRender(){clearTimeout(rt);rt=setTimeout(()=>{if(!ME)return;const a=document.activeElement,typing=a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)&&$('#app').contains(a);if($('#mo').classList.contains('on')||typing){softRender();return}render()},400)}
function lis(c,get,key,sort){return db.collection(c).onSnapshot(s=>{let ch=0;s.docChanges().forEach(x=>{if(x.doc.metadata.hasPendingWrites)return;const v=x.doc.data(),arr=get(),i=arr.findIndex(y=>y[key]==x.doc.id);if(x.type=='removed'){if(i>=0){arr.splice(i,1);ch=1}delete last[c+'/'+x.doc.id]}else{if(i>=0)arr[i]=v;else arr.push(v);last[c+'/'+x.doc.id]=cj(v);ch=1}});if(ch){if(sort)get().sort(byId);softRender()}},()=>{})}
function listen(){unsubs.forEach(f=>f());unsubs=[];for(const[k,c]of Object.entries(COLS))unsubs.push(lis(c,()=>D[k],'id',true));unsubs.push(lis('hms_users',()=>D.users,'u',false));
unsubs.push(db.doc('hms_meta/config').onSnapshot(s=>{if(s.metadata.hasPendingWrites||!s.exists)return;D.cfg=s.data().cfg||D.cfg;last['hms_meta/config']=cj({cfg:D.cfg,v:D.v||3});softRender()},()=>{}))}
async function autoSetup(){busyMsg('Creating the shared database (first run)…');const s=seed();s.users=s.users.filter(u=>u.u=='admin');s.pat=[];s.apt=[];s.dept.forEach(d=>{d.head=''});D=Object.assign(empty(),s);ME={u:'admin',r:'admin'};last={};
if(!await push())throw new Error('Could not write to Firestore. Publish the rules (Settings › Shared database, or Firestore › Rules) and reload.');await db.doc('hms_meta/setup').set({done:true,at:new Date().toISOString()});ME=null;D=empty();last={}}
async function cloudLogin(){const u=$('#lu').value.trim().toLowerCase(),p=$('#lp').value,er=m=>{$('#le').textContent=m};if(!u||!p){er('Enter your username and password.');return}if(!/^[a-z0-9._-]+$/.test(u)){er('Invalid username or password.');return}
try{const d=await db.doc('hms_users/'+u).get();if(!d.exists||!pwOk(d.data(),p)){er('Invalid username or password.');return}if(!d.data().on){er('This account is disabled.');return}await enterCloud(d.data())}catch(e){er(am(e))}}
async function enterCloud(x){busyMsg('Loading shared data…');try{await pull();listen()}catch(e){ME=null;render();$('#le').textContent='Could not load data: '+am(e);return}
ME=D.users.find(u=>u.u==x.u)||x;try{sessionStorage.setItem('hms_cs',JSON.stringify({u:x.u,p:x.p}))}catch(e){}V.tab='dash';V.pid=null;sy('Shared database connected');render();
if(ME.u=='admin'&&pwOk(ME,'admin123'))setTimeout(()=>alert('You are using the default password. Please change it now: Staff & Users › Reset password.'),600)}
async function boot(){busyMsg('Connecting to the shared database…');
try{if(!window.firebase)throw new Error('The Firebase library could not load. Check your internet connection.');firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();try{db.settings({ignoreUndefinedProperties:true})}catch(e){}
const su=await db.doc('hms_meta/setup').get();if(!su.exists)await autoSetup();
let ss=null;try{ss=JSON.parse(sessionStorage.getItem('hms_cs'))}catch(e){}
if(ss&&/^[a-z0-9._-]+$/.test(ss.u||'')){const d=await db.doc('hms_users/'+ss.u).get();if(d.exists&&d.data().on&&d.data().p==ss.p){await enterCloud(d.data());return}}}
catch(e){busyMsg('Could not connect: '+am(e));return}render()}
CLOUD?boot():render();
</script></body></html>
